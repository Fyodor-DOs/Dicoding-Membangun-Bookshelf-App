<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Book Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">📚 My Library</h1>
                <p class="text-gray-600">Manage your book collection efficiently</p>
            </div>
            <button onclick="toggleModal()"
                class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                        clip-rule="evenodd" />
                </svg>
                Add Book
            </button>
        </header>

        <div class="mb-8 flex justify-between items-center">
            <input type="text" id="search" placeholder="Search books..."
                class="w-64 px-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500"
                onkeyup="searchBooks()">
            <div class="flex gap-4">
                <div class="bg-white p-4 rounded-lg shadow">
                    <p class="text-gray-500">Total Books</p>
                    <p id="total-books" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <p class="text-gray-500">Completed</p>
                    <p id="completed-books" class="text-2xl font-bold">0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-semibold mb-4 text-red-500">📖 Unread Books</h2>
                <div id="unread-list" class="space-y-3"></div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-semibold mb-4 text-green-500">✅ Read Books</h2>
                <div id="read-list" class="space-y-3"></div>
            </div>
        </div>

        <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-white rounded-xl p-8 w-full max-w-md">
                <h3 class="text-2xl font-bold mb-6">📕 Add New Book</h3>
                <form onsubmit="event.preventDefault(); addBook()">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Title</label>
                        <input type="text" id="title" class="w-full px-4 py-2 border rounded-lg" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Author</label>
                        <input type="text" id="author" class="w-full px-4 py-2 border rounded-lg" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Year</label>
                        <input type="number" id="year" class="w-full px-4 py-2 border rounded-lg" required>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 mb-2">Status</label>
                        <select id="status" class="w-full px-4 py-2 border rounded-lg">
                            <option value="unread">Unread</option>
                            <option value="read">Read</option>
                        </select>
                    </div>

                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="toggleModal()"
                            class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                            Cancel
                        </button>
                        <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
                            Save Book
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="buku.js"></script>
</body>
</html>
